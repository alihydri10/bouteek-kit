<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouteek Kit</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="bm" viewBox="0 0 76.32 70.7" aria-hidden="true"><path d="M0 31.43V0h59.71c8.68 0 15.71 7.04 15.71 15.71s-7.04 15.71-15.71 15.71H0z"/><path d="M0 70.7V39.27h60.61c8.68 0 15.71 7.04 15.71 15.71S69.29 70.69 60.61 70.69H0z"/></svg>
      <img class="lt" src="img/logotype.svg" alt="Bouteek">
      <span class="kit">Kit</span>
    </div>
    <button class="ib" id="btnAbout" title="About">i</button>
  </header>

  <div class="upd" id="upd">
    <span id="updTxt"></span>
    <button id="btnUpd">Update</button>
  </div>

  <nav class="tabs" id="tabs">
    <button data-cat="logo" class="on">Logo</button>
    <button data-cat="cta">CTA</button>
    <button data-cat="trans">Transition</button>
  </nav>

  <main class="list" id="list"></main>

  <section class="texts" id="texts">
    <div class="tf"><input id="txtEn" type="text" dir="ltr" spellcheck="false" placeholder="English CTA text"><button class="rs" id="rsEn" title="Back to the original text">&#8634;</button></div>
    <div class="tf"><input id="txtAr" type="text" dir="rtl" spellcheck="false" placeholder="Arabic CTA text"><button class="rs" id="rsAr" title="Back to the original text">&#8634;</button></div>
  </section>

  <section class="colors">
    <div class="row">
      <label>Style</label>
      <div class="schemes" id="schemes"></div>
    </div>
    <div class="row">
      <label>Shapes</label>
      <div class="dots" id="dots"></div>
    </div>
    <div class="row" id="bgRow">
      <label>BG</label>
      <button class="tog on" id="btnBg" title="Background on / off"><i></i></button>
      <span class="hint" id="bgHint">Background on</span>
    </div>
  </section>

  <footer class="actions">
    <button class="go" id="btnAdd">Add</button>
    <button class="ghost" id="btnRecolor" title="Apply colours, BG and text to the selected Bouteek layer or clip">Update selected</button>
  </footer>
  <div class="status" id="status"></div>

  <div class="about" id="about">
    <button class="x" id="btnClose" title="Close">&times;</button>
    <img class="bbx" src="img/bbx_logo.svg" alt="BlueBearX">
    <div class="card">
      <img class="pic" src="img/portrait.jpg" alt="">
      <div class="ttl">Bouteek Kit <span class="ver" id="ver"></span></div>
      <p class="sub">A brand panel for After Effects &amp; Premiere Pro</p>
      <div class="lines">
        <p>If it works well, <b>Ali</b> did his job right.</p>
        <p>If it's buggy, it's <b>Claude's</b> fault.</p>
      </div>
      <p class="breath">Take a deep breath and tell us,<br>so we can fix it.</p>
    </div>
    <p class="foot">Made at <b>BlueBearX</b></p>
  </div>

  <div class="splash" id="splash">
    <img class="pic" src="img/portrait.jpg" alt="">
    <div class="sbrand">
      <svg class="bm" viewBox="0 0 76.32 70.7" aria-hidden="true"><path d="M0 31.43V0h59.71c8.68 0 15.71 7.04 15.71 15.71s-7.04 15.71-15.71 15.71H0z"/><path d="M0 70.7V39.27h60.61c8.68 0 15.71 7.04 15.71 15.71S69.29 70.69 60.61 70.69H0z"/></svg>
      <img class="lt" src="img/logotype.svg" alt="Bouteek">
    </div>
    <div class="bar"><i></i></div>
    <img class="sbbx" src="img/bbx_logo_light.svg" alt="BlueBearX">
  </div>
</div>
<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
